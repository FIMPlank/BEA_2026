        'gesperrt — dort ist jemand im Urlaub, krank oder in der Berufsschule, da kann niemand eingeplant werden.</div></div>'
      : '<div class="banner is-ok">' + ico('check') + '<div class="grow"><b>Alle Schichten sind besetzt.</b></div></div>') +

    '<div class="row-wrap">' +
      '<span class="mark is-info">' + ico('sync', '') + ' Mitarbeiter-App · abgeglichen 07:14</span>' +
      '<span class="mark is-ink">' + MITARBEITER.length + ' Mitarbeitende</span>' +
      '<span class="mark">' + MITARBEITER.filter(p => p.azubi).length + ' Azubis</span>' +
      '<span class="mark is-warn">' + abwGes.length + ' mit Abwesenheit diese Woche</span>' +
      '<span class="grow"></span>' +
      '<span class="tiny faint">Abwesenheiten kommen aus der App. Berufsschultage der Azubis zusätzlich aus dem Laufplan.</span>' +
    '</div>' +

    '<div class="scrollbox"><div class="duty">' + g + '</div></div>' +

    '<div class="row-wrap tiny muted">' +
      '<span class="shift s-frueh">Frühdienst</span><span class="shift s-spaet">Spätdienst</span>' +
      '<span class="shift s-frei">frei</span><span class="absence a-urlaub">Urlaub</span>' +
      '<span class="absence a-schule">Berufsschule</span><span class="absence a-krank">krank</span>' +
      '<span style="margin-left:6px">Azubis sind links mit einem türkisen Balken markiert.</span>' +
    '</div></div>';
};

/* ==========================================================================
   9 · BESTELLUNG — die Rechnung offen hinlegen
   ========================================================================== */

const DECKT = { di:[2,3,4], fr:[5,6,0,1] };

function bedarfFuer(tage) {
  const w = woche(), p = planNow(), b = {};
  for (const d of tage) {
    for (const m of MAHLZEIT) {
      const s = speise(p[m.k][d]);
      if (!s) continue;
      const gaeste = w.gaeste[d][m.k];
      for (const [k, menge] of s.zut) {
        if (!ARTIKEL.some(a => a.k === k)) continue;   /* Demo: nur die 26 gefuehrten Artikel */
        b[k] = (b[k] || 0) + menge * gaeste;
      }
    }
  }
  return b;
}

R.bestellung = function () {
  el('scr-bestellung').innerHTML = '<div class="stack">' +
    '<div class="banner is-info">' + ico('info') + '<div class="grow">' +
      '<b>Die Bestellmenge wird gerechnet, nicht geschätzt.</b> ' +
      'Bedarf aus der freigegebenen Speisekarte und den Gästezahlen, minus dem, was morgens im Lager lag. ' +
      'Die Rechnung steht offen in den Spalten — du kannst jede Menge überschreiben.</div></div>' +
    BESTELLUNGEN.map(bestellKarte).join('') + '</div>';
};

function bestellKarte(b) {
  const bedarf = bedarfFuer(DECKT[b.id]);
  const zeilen = ARTIKEL.map(a => {
    const soll = bedarf[a.k] || 0;
    const lager = state.lager[a.k] && state.lager[a.k].m.v !== '' ? Number(state.lager[a.k].m.v) : 0;
    const roh = soll - lager;
    return { a, soll, lager, best: roh > 0 ? Math.ceil(roh) : 0 };
  }).filter(z => z.soll > 0 || z.best > 0);

  const summe = zeilen.filter(z => z.best > 0).length;

  return '<section class="card">' +
    '<div class="card-head">' +
      '<div><h2>' + esc(b.name) + '</h2>' +
        '<span class="sub">Abgabe ' + esc(b.abgabe) + ' · Lieferung ' + esc(b.liefer) + ' · deckt ' + esc(b.deckt) + '</span></div>' +
      '<span class="mark ' + (b.status === 'raus' ? 'is-ok' : 'is-warn') + '">' +
        (b.status === 'raus' ? 'versandt ' + esc(b.versand) : 'noch offen') + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      (b.beleg
        ? '<div class="row" style="background:#F6FBF8;padding:10px 12px;margin-bottom:12px">' + ico('datei') +
          '<span class="grow small"><b style="color:var(--ink)">' + esc(b.beleg.art) + ' liegt vor:</b> ' +
          esc(b.beleg.datei) + ' — eingegangen ' + esc(b.beleg.an) + '</span>' +
          '<button class="btn btn-outline btn-sm">Bestellt gegen geliefert prüfen</button></div>'
        : '<div class="row" style="background:#FFF9E3;padding:10px 12px;margin-bottom:12px">' + ico('info') +
          '<span class="grow small">Noch kein Lieferschein und keine Bestätigung. Beides wird hier abgelegt, ' +
          'sobald es da ist — danach vergleicht das Dashboard bestellt gegen geliefert.</span>' +
          '<button class="btn btn-outline btn-sm">Beleg ablegen</button></div>') +
      '<div class="table-wrap"><table class="table">' +
        '<thead><tr><th>Artikel</th><th class="r">Bedarf laut Speisekarte</th>' +
        '<th class="r">Lager morgens</th><th class="r">Zu bestellen</th><th>Einheit</th><th>Lieferant</th></tr></thead>' +
        '<tbody>' + (zeilen.length ? zeilen.map(z =>
          '<tr><td class="strong">' + esc(z.a.name) + '</td>' +
          '<td class="r">' + nf(z.soll, 1) + '</td>' +
          '<td class="r' + (z.lager < z.a.min ? ' ' : '') + '">' + nf(z.lager, 0) +
            (z.lager < z.a.min ? ' <span class="tag warn">unter Minimum</span>' : '') + '</td>' +
          '<td class="r strong">' + (z.best ? nf(z.best, 0) : '<span class="faint">–</span>') + '</td>' +
          '<td class="muted">' + esc(z.a.e) + '</td>' +
          '<td class="muted small">' + esc(z.a.lief) + '</td></tr>'
        ).join('') : '<tr><td colspan="6"><div class="empty"><b>Nichts zu rechnen</b>' +
          'Die Speisekarte für diese Tage ist noch leer.</div></td></tr>') + '</tbody>' +
      '</table></div>' +
    '</div>' +
    '<div class="card-foot">' +
      '<button class="btn ' + (b.status === 'raus' ? 'btn-outline' : 'btn-primary') + '"' + (b.status === 'raus' ? ' disabled' : '') + '>' +
        (b.status === 'raus' ? 'Bereits versandt' : 'Bestellung absenden') + '</button>' +
      '<button class="btn btn-outline">Als Liste drucken</button>' +
      '<span class="grow"></span>' +
      '<span class="tiny faint">' + summe + ' Artikel zu bestellen</span>' +
    '</div></section>';
}

/* ==========================================================================
   10 · LAGERBESTAND — zweimal am Tag, darum auf Tempo gebaut
   ========================================================================== */

R.lager = function () {
  const offen = lagerOffen();
  const knapp = ARTIKEL.filter(a => { const l = state.lager[a.k]; return l && l.m.v !== '' && Number(l.m.v) < a.min; });
  const falsch = ARTIKEL.filter(a => {
    const l = state.lager[a.k];
    return l && l.m.v !== '' && l.a.v !== '' && Number(l.a.v) > Number(l.m.v);
  });

  el('scr-lager').innerHTML = '<div class="stack">' +
    (offen
      ? '<div class="banner is-warn">' + ico('uhr') + '<div class="grow"><b>' + offen +
        ' Zählungen fehlen noch.</b> Die Morgenzählung ist durch, die Abendzählung steht aus. ' +
        'Zahl tippen, Tabulator, nächster Artikel — es speichert selbst.</div>' +
        '<button class="btn btn-primary btn-sm" id="zaehl-start">Bestandsaufnahme starten</button></div>'
      : '<div class="banner is-ok">' + ico('check') + '<div class="grow"><b>Morgens und abends sind vollständig gezählt.</b></div></div>') +

    (falsch.length
      ? '<div class="banner is-alert">' + ico('warn') + '<div class="grow"><b>' + falsch.length +
        (falsch.length === 1 ? ' Artikel hat' : ' Artikel haben') + ' abends mehr auf Lager als morgens.</b> ' +
        'Das geht ohne Lieferung nicht — meist ein Zahlendreher. Betroffen: ' +
        esc(falsch.map(a => a.name).join(', ')) + '.</div></div>'
      : '') +

    '<div class="row-wrap">' +
      '<span class="mark is-ink">' + ARTIKEL.length + ' Artikel</span>' +
      '<span class="mark ' + (knapp.length ? 'is-alert' : 'is-ok') + '">' + knapp.length + ' unter Mindestbestand</span>' +
      '<span class="mark">' + (ARTIKEL.length * 2 - offen) + ' von ' + (ARTIKEL.length * 2) + ' Zählungen erfasst</span>' +
    '</div>' +

    '<section class="card" style="max-width:1060px"><div class="table-wrap"><table class="table">' +
      '<thead><tr><th>Artikel</th><th class="r">Mindest</th>' +
      '<th class="r stock-group">Morgens</th><th>Uhrzeit</th>' +
      '<th class="r stock-group">Abends</th><th>Uhrzeit</th>' +
      '<th class="r">Verbrauch</th><th>Füllstand</th></tr></thead><tbody>' +
      ARTIKEL.map(lagerZeile).join('') +
    '</tbody></table></div></section></div>';

  document.querySelectorAll('[data-stock]').forEach(inp => {
    inp.oninput = () => {
      const [k, teil] = inp.dataset.stock.split('|');
      const v = inp.value.replace(',', '.');
      state.lager[k][teil] = { v, ts: v === '' ? null : uhrzeit() };
      renderNav();
      const st = el('stock-stamp-' + k + '-' + teil);
      if (st) st.textContent = v === '' ? '–' : state.lager[k][teil].ts;
      inp.classList.toggle('is-filled', v !== '');
      const l = state.lager[k];
      inp.classList.toggle('is-bad', teil === 'a' && v !== '' && l.m.v !== '' && Number(v) > Number(l.m.v));
    };
    inp.onblur = () => { if (inp.value !== '') R.lager(); };
  });
  const st = el('zaehl-start');
  if (st) st.onclick = () => {
    const erste = document.querySelector('input[data-stock$="|a"][value=""]');
    if (erste) { erste.focus(); erste.scrollIntoView({ block:'center', behavior:'smooth' }); }
  };
};

function uhrzeit() {
  return new Date().toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}

function lagerZeile(a) {
  const l = state.lager[a.k];
  const mv = l.m.v === '' ? null : Number(l.m.v);
  const av = l.a.v === '' ? null : Number(l.a.v);
  const verbrauch = mv != null && av != null ? mv - av : null;
  const pct = mv != null ? Math.min(100, Math.round(mv / (a.min * 2) * 100)) : 0;
  const ton = mv == null ? '' : mv < a.min * 0.5 ? 'out' : mv < a.min ? 'low' : '';
  return '<tr>' +
    '<td class="strong">' + esc(a.name) + ' <span class="faint tiny">' + esc(a.e) + '</span></td>' +
    '<td class="r muted">' + nf(a.min) + '</td>' +
    '<td class="r stock-group"><input class="stock-in' + (l.m.v !== '' ? ' is-filled' : '') +
      '" data-stock="' + a.k + '|m" value="' + esc(l.m.v) + '" inputmode="decimal" aria-label="' + esc(a.name) + ' morgens"></td>' +
    '<td><span class="stock-stamp" id="stock-stamp-' + a.k + '-m">' + (l.m.ts || '–') + '</span></td>' +
    '<td class="r stock-group"><input class="stock-in' + (l.a.v !== '' ? ' is-filled' : '') +
      (av != null && mv != null && av > mv ? ' is-bad' : '') +
      '" data-stock="' + a.k + '|a" value="' + esc(l.a.v) + '" inputmode="decimal" aria-label="' + esc(a.name) + ' abends"></td>' +
    '<td><span class="stock-stamp" id="stock-stamp-' + a.k + '-a">' + (l.a.ts || '–') + '</span></td>' +
    '<td class="r">' + (verbrauch == null ? '<span class="faint">–</span>' :
        '<span class="num">' + nf(verbrauch, 1) + '</span>') + '</td>' +
    '<td><div class="bar-mini"><i class="' + ton + '" style="width:' + pct + '%"></i></div>' +
      (mv != null && mv < a.min ? '<span class="tiny" style="color:var(--ihk-red);font-weight:600">unter Minimum</span>' : '') +
    '</td></tr>';
}

/* ==========================================================================
   11 · STAMMDATEN
   ========================================================================== */

function letzteVerwendung(id) {
  for (let i = WOCHEN.length - 1; i >= 0; i--) {
    const p = state.plan[WOCHEN[i].kw];
    if (!p) continue;
    for (const mz of ['F','M','A']) {
      const d = p[mz].indexOf(id);
      if (d > -1) return 'KW ' + WOCHEN[i].kw + ', ' + TAGE[d] + ' ' + MAHLZEIT.find(m => m.k === mz).name;
    }
  }
  return null;
}

R.speisen = function () {
  const q = state.speisen.q.trim().toLowerCase();
  let liste = SPEISEN;
  if (state.speisen.kat !== 'alle') liste = liste.filter(s => s.kat === state.speisen.kat);
  if (state.speisen.mz !== 'alle') liste = liste.filter(s => s.mz.includes(state.speisen.mz));
  if (q) liste = liste.filter(s => s.name.toLowerCase().includes(q));

  el('scr-speisen').innerHTML = '<div class="stack">' +
    '<div class="banner is-info">' + ico('info') + '<div class="grow">' +
      '<b>Diese Liste kommt später aus deiner Excel.</b> Die Spalten hier sind gleichzeitig mein Vorschlag, ' +
      'welche Spalten die Excel haben sollte. Am wichtigsten ist die letzte Spalte — <b>Zutaten pro Portion</b>. ' +
      'Ohne sie kann die Bestellung nicht rechnen und bleibt Handarbeit.</div></div>' +

    '<section class="card">' +
      '<div class="card-head"><h2>' + SPEISEN.length + ' Speisen</h2>' +
        '<span class="sub">' + liste.length + ' passen zu Suche und Filter</span></div>' +
      '<div class="card-body" style="padding-bottom:10px"><div class="row-wrap">' +
        '<input class="field" id="sp-q" placeholder="Speise suchen" style="width:220px" value="' + esc(state.speisen.q) + '">' +
        '<select class="field" id="sp-kat"><option value="alle">Alle Kategorien</option>' +
          Object.keys(KAT_NAME).map(k => '<option value="' + k + '"' + (state.speisen.kat === k ? ' selected' : '') + '>' +
            esc(KAT_NAME[k]) + ' (' + SPEISEN.filter(s => s.kat === k).length + ')</option>').join('') +
        '</select>' +
        '<select class="field" id="sp-mz"><option value="alle">Alle Mahlzeiten</option>' +
          MAHLZEIT.map(m => '<option value="' + m.k + '"' + (state.speisen.mz === m.k ? ' selected' : '') + '>' +
            esc(m.name) + ' (' + SPEISEN.filter(s => s.mz.includes(m.k)).length + ')</option>').join('') +
        '</select>' +
      '</div></div>' +
      '<div class="table-wrap"><table class="table">' +
        '<thead><tr><th>Name</th><th>Kategorie</th><th>Mahlzeit</th><th>Saison</th>' +
        '<th>Allergene</th><th>Haupt&shy;komponente</th><th>Aufwand</th><th>Letzte Verwendung</th>' +
        '<th>Zutaten pro Portion</th></tr></thead><tbody>' +
        liste.map(s => {
          const lv = letzteVerwendung(s.id);
          return '<tr><td class="strong">' + esc(s.name) + '</td>' +
          '<td class="muted">' + esc(KAT_NAME[s.kat] || s.kat) + '</td>' +
          '<td>' + s.mz.map(m => '<span class="tag">' + MAHLZEIT.find(x => x.k === m).name.slice(0,5) + '</span>').join(' ') + '</td>' +
          '<td class="muted">' + esc(SAISON_NAME[s.saison]) + '</td>' +
          '<td>' + (s.allergene.length
              ? '<span class="tag alg" title="' + esc(s.allergene.map(a => ALLERGEN[a]).join(', ')) + '">' + s.allergene.join(' ') + '</span>'
              : '<span class="faint">keine</span>') + '</td>' +
          '<td class="muted">' + (s.haupt ? 'ja' : 'nein') + '</td>' +
          '<td class="muted">' + esc(s.aufwand) + '</td>' +
          '<td class="muted small">' + (lv ? esc(lv) : '<span class="faint">noch nie</span>') + '</td>' +
          '<td class="muted small">' + s.zut.map(z => esc(z[0]) + ' ' + nf(z[1], 3)).join(', ') + '</td></tr>';
        }).join('') +
      '</tbody></table></div>' +
    '</section></div>';

  const q1 = el('sp-q');
  q1.oninput = () => { state.speisen.q = q1.value; R.speisen(); const n = el('sp-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el('sp-kat').onchange = (e) => { state.speisen.kat = e.target.value; R.speisen(); };
  el('sp-mz').onchange = (e) => { state.speisen.mz = e.target.value; R.speisen(); };
};

R.mitarbeiter = function () {
  el('scr-mitarbeiter').innerHTML = '<div class="stack">' +
    '<div class="banner is-info">' + ico('sync') + '<div class="grow">' +
      '<b>Abwesenheiten kommen aus der Mitarbeiter-App.</b> Im Prototyp sind sie erfunden. ' +
      'Für die echte Verbindung müssen wir klären, ob die App eine Schnittstelle anbietet — ' +
      'sonst bleibt es beim Eintippen.</div>' +
      '<span class="mark is-ok">abgeglichen 07:14</span></div>' +

    '<section class="card"><div class="table-wrap"><table class="table">' +
      '<thead><tr><th>Name</th><th>Rolle</th><th>Azubi</th><th>Diese Woche abwesend</th><th>Tage</th></tr></thead><tbody>' +
      MITARBEITER.map(p => {
        const tage = [0,1,2,3,4,5,6].filter(d => abwesenheit(p, d));
        const art = tage.length ? abwesenheit(p, tage[0]) : null;
        return '<tr><td class="strong">' + esc(p.name) + '</td>' +
          '<td class="muted">' + esc(p.rolle) + '</td>' +
          '<td class="muted">' + (p.azubi ? 'ja' : '–') + '</td>' +
          '<td>' + (art ? '<span class="mark is-' + (art === 'krank' ? 'alert' : art === 'urlaub' ? 'info' : 'ok') + '">' +
                    esc(ABW_NAME[art]) + '</span>' : '<span class="faint">–</span>') + '</td>' +
          '<td class="muted">' + (tage.length ? tage.map(d => TAGE[d]).join(', ') : '<span class="faint">–</span>') + '</td></tr>';
      }).join('') +
    '</tbody></table></div></section></div>';
};

R.einstellungen = function () {
  const regeln = [
    ['Ein Gericht genau einmal pro Woche', 'Gilt über Frühstück, Mittag und Abendessen hinweg. Ein zweites Auftreten ist ein Fehler, keine Warnung.'],
    ['Drei Mahlzeiten, sieben Tage', '21 Felder pro Woche. Bei ' + SPEISEN.length + ' Speisen reicht der Vorrat für ' + Math.floor(SPEISEN.length / 21) + ' Wochen ohne jede Wiederholung.'],
    ['Jahreszeit', 'Aktuell eingestellt: ' + SAISON_NAME[SAISON_JETZT] + '. Speisen außerhalb der Saison werden markiert, aber nicht gesperrt.'],
    ['Bestellrhythmus', 'Zweimal pro Woche — Dienstag deckt Mittwoch bis Freitag, Freitag deckt Samstag bis Dienstag.'],
    ['Lagerzählung', 'Zweimal täglich, morgens und abends, mit Zeitstempel. Manuelle Eingabe.'],
  ];
  const verb = [
    ['Laufplan als PDF', 'wöchentlicher Upload', 'Prototyp: Funde sind erfunden', 'is-warn'],
    ['Speisen-Excel', SPEISEN.length + ' Speisen', 'Prototyp: Beispieldaten, Excel liegt noch nicht vor', 'is-warn'],
    ['Mitarbeiter-App', 'Urlaub, Berufsschule, Krankmeldung', 'Prototyp: Schnittstelle noch nicht geklärt', 'is-warn'],
    ['Lieferanten', [...new Set(ARTIKEL.map(a => a.lief))].length + ' Betriebe', 'im Prototyp fest eingetragen', 'is-warn'],
  ];
  el('scr-einstellungen').innerHTML = '<div class="cols-2">' +
    '<section class="card"><div class="card-head"><h2>Die Regeln der Wochenplanung</h2></div>' +
      '<div class="card-body" style="padding-top:8px">' + regeln.map(r =>
        '<div style="padding:10px 0;border-bottom:1px solid var(--rule)">' +
        '<div style="font-size:13.5px;font-weight:600;color:var(--ink)">' + esc(r[0]) + '</div>' +
        '<div class="small muted" style="margin-top:2px">' + esc(r[1]) + '</div></div>').join('') +
      '</div></section>' +
    '<section class="card"><div class="card-head"><h2>Verbindungen</h2>' +
      '<span class="sub">Was noch echt werden muss</span></div>' +
      '<div class="card-body" style="padding-top:8px">' + verb.map(v =>
        '<div class="row" style="padding:10px 0;border-bottom:1px solid var(--rule)">' +
        '<div class="grow"><div style="font-size:13.5px;font-weight:600;color:var(--ink)">' + esc(v[0]) + '</div>' +
        '<div class="small muted">' + esc(v[1]) + ' — ' + esc(v[2]) + '</div></div>' +
        '<span class="mark ' + v[3] + '">Prototyp</span></div>').join('') +
      '</div></section></div>';
};

/* ==========================================================================
   12 · START
   ========================================================================== */

WOCHEN.forEach(w => state.plan[w.kw] = buildPlan(w));
ARTIKEL.forEach(a => state.lager[a.k] = {
  m: { v: a.m == null ? '' : String(a.m), ts: a.m == null ? null : '06:12' },
  a: { v: '', ts: null },
});
go('cockpit');
</script>
</body>
</html>
