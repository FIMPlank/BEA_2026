<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IHK Kantine — Wochenplanung</title>

<!-- Source Sans Pro ist die Hausschrift der IHK. Auf Google Fonts heisst die
     aktuelle Ausgabe "Source Sans 3" (gleiche Schrift, neuer Name), darum laden
     wir die und lassen einer lokal installierten Source Sans Pro den Vortritt. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   IHK Kantine — Wochenplanung
   Prototyp. Alle Daten sind erfunden (siehe Block "BEISPIELDATEN" im Skript).

   Farben und Schrift stammen aus dem produktiven CSS von ihk-muenchen.de und
   ihk.de. Der Aufbau (schmale Icon-Leiste, schwebende weisse Karten) stammt
   aus vantix-os. Wo die IHK keinen Wert vorgibt, steht es als "abgeleitet"
   dabei.
   ========================================================================== */

:root {
  /* --- IHK, belegt aus dem Website-CSS ------------------------------------ */
  --ihk-blue-dark: #003366;   /* Hausfarbe: Ueberschriften, Zahlen, Buttons   */
  --ihk-blue:      #009ED4;   /* Akzent: alles Anklickbare, aktive Navigation */
  --ihk-red:       #D43D25;   /* Fehler                                       */
  --ihk-yellow:    #FDC600;   /* Hinweis, offen                               */
  --ihk-teal:      #077EAF;   /* zweiter Akzent                               */
  --titan-100:     #58585A;   /* Fliesstext                                   */
  --titan-80:      #79797B;   /* Nebentext                                    */
  --titan-30:      #CDCDCE;   /* Rahmen, Trennlinien                          */
  --dimmer-ocean:  #F2F5F7;   /* Seitengrund                                  */
  --dimmer-sky:    #E9F5FA;   /* Hervorhebung                                 */

  /* --- abgeleitet: die IHK dokumentiert kein Gruen und keine Haarlinie ----- */
  --green:         #1F8A5F;   /* erledigt, ausreichend                        */
  --rule:          #E4E9ED;   /* Haarlinie, heller als titan-30               */
  --fg-faint:      #9A9A9C;

  /* --- Rollen -------------------------------------------------------------- */
  --canvas:    var(--dimmer-ocean);
  --surface:   #ffffff;
  --ink:       var(--ihk-blue-dark);
  --fg:        var(--titan-100);
  --fg-muted:  var(--titan-80);
  --accent:    var(--ihk-blue);
  --accent-ink:#0079A3;                        /* abgeleitet: Hover-Ton       */
  --accent-wash: var(--dimmer-sky);

  /* Schatten blau getoent statt neutralschwarz - passt in die Blauwelt. */
  --shadow-card: 0 1px 2px rgba(0,51,102,.05), 0 8px 24px -10px rgba(0,51,102,.14);
  --shadow-lift: 0 2px 4px rgba(0,51,102,.07), 0 14px 32px -12px rgba(0,51,102,.20);
  --shadow-pop:  0 18px 44px -12px rgba(0,51,102,.28);

  /* Ecken: 8px auf Karten (Vantix-Gefuehl), Buttons scharfkantig (IHK). */
  --r-card: 8px;
  --r-sm:   4px;

  --sans: "Source Sans Pro", "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;

  --rail-w: 64px;
  --rail-open: 248px;
  --head-h: 56px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern","liga","tnum";
}

h1,h2,h3,h4 { color: var(--ink); margin: 0; font-weight: 600; letter-spacing: -.01em; }

/* Zahlen tragen die Marke: immer dunkelblau, immer tabellarisch. */
.num { color: var(--ink); font-variant-numeric: tabular-nums; }

a { color: var(--accent-ink); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

::selection { background: rgba(0,158,212,.24); }

/* ==========================================================================
   Grundgerüst
   ========================================================================== */

.app { display: flex; min-height: 100%; }

/* --- Icon-Leiste: 64px schmal, klappt bei Maus/Tastatur auf 248px auf und
       legt sich ueber den Inhalt. Der Inhalt springt dabei nicht. ---------- */
.rail { flex: 0 0 var(--rail-w); width: var(--rail-w); position: relative; }

.rail-inner {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
  width: var(--rail-w);
  display: flex; flex-direction: column;
  overflow: hidden;
  background: transparent;
  transition: width .18s cubic-bezier(.22,.61,.36,1),
              background-color .18s, box-shadow .18s;
}
.rail:hover .rail-inner,
.rail:focus-within .rail-inner {
  width: var(--rail-open);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
}

.brand {
  display: grid; grid-template-columns: 40px 1fr; align-items: center;
  gap: 10px; height: 56px; margin: 6px 12px 2px; text-decoration: none;
}
.brand-mark {
  width: 32px; height: 32px; display: grid; place-items: center;
  background: var(--ihk-blue-dark); color: #fff;
  font-weight: 700; font-size: 11px; letter-spacing: .02em;
  justify-self: center;
}
.brand-text { white-space: nowrap; }
.brand-text b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand-text span { display: block; color: var(--fg-faint); font-size: 11px; }

.rail-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 0 12px; }

.nav-group-label {
  margin: 14px 12px 6px; padding-left: 12px;
  font-size: 11px; font-weight: 600; color: var(--fg-faint);
  white-space: nowrap;
}

.nav-item {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
  gap: 8px; height: 38px; margin: 1px 12px; padding: 0;
  border: 0; background: none; width: calc(100% - 24px);
  font: inherit; color: var(--fg-muted); text-align: left;
  cursor: pointer; border-radius: var(--r-sm);
  transition: background-color .12s, color .12s;
}
.nav-item svg { justify-self: center; width: 19px; height: 19px; }
.nav-item:hover { background: #F5F7F9; color: var(--ink); }
.nav-item[aria-current="page"] {
  background: var(--accent-wash); color: var(--ink); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Beschriftungen erscheinen erst beim Aufklappen. */
.nav-label, .brand-text, .nav-group-label, .nav-count { opacity: 0; transition: opacity .12s .04s; }
.rail:hover .nav-label, .rail:focus-within .nav-label,
.rail:hover .brand-text, .rail:focus-within .brand-text,
.rail:hover .nav-group-label, .rail:focus-within .nav-group-label,
.rail:hover .nav-count, .rail:focus-within .nav-count { opacity: 1; }

.nav-count {
  min-width: 20px; text-align: center; padding: 1px 5px;
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.nav-count.is-alert { background: var(--ihk-red); color: #fff; }
.nav-count.is-open  { background: var(--ihk-yellow); color: #4a3b00; }
.nav-count.is-quiet { color: var(--fg-faint); }
.nav-count.is-soon  { color: var(--fg-faint); border: 1px solid var(--titan-30); font-weight: 500; }

.rail-foot { border-top: 1px solid var(--rule); padding: 8px 0; }

/* --- Kopfzeile: haelt die Kalenderwoche. Sie steht ueber allem, darum ist
       sie immer sichtbar und immer an derselben Stelle. ------------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.head {
  position: sticky; top: 0; z-index: 20;
  height: var(--head-h); flex: 0 0 var(--head-h);
  display: flex; align-items: center; gap: 20px;
  padding: 0 24px;
  background: rgba(242,245,247,.88); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.head-title { min-width: 0; flex: 1; }
.head-title h1 { font-size: 16px; line-height: 1.2; }
.head-title p { margin: 0; font-size: 12px; color: var(--fg-muted); }

.weekpick { display: flex; align-items: center; gap: 2px; }
.weekpick button {
  width: 30px; height: 30px; display: grid; place-items: center;
  border: 1px solid var(--titan-30); background: var(--surface);
  color: var(--ink); cursor: pointer;
}
.weekpick button:hover:not(:disabled) { background: var(--accent-wash); border-color: var(--accent); }
.weekpick button:disabled { color: var(--titan-30); cursor: default; }
.weekpick-label {
  min-width: 178px; height: 30px; display: grid; place-items: center;
  border: 1px solid var(--titan-30); border-inline: 0;
  background: var(--surface);
  font-size: 13px; font-weight: 600; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.content { padding: 20px 24px 56px; }

/* Ein Bildschirm zur Zeit. Die Bewegung antwortet auf einen Klick - sie
   laeuft nicht von selbst los. */
.screen { display: none; }
.screen.is-active { display: block; animation: viewin .2s cubic-bezier(.16,1,.3,1) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .screen.is-active { animation: none; }
  .rail-inner { transition: none; }
}

/* ==========================================================================
   Bausteine
   ========================================================================== */

.card {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 18px 0;
}
.card-head h2 { font-size: 17px; font-weight: 300; }
.card-head .sub { font-size: 12px; color: var(--fg-muted); }
.card-body { padding: 16px 18px; }
.card-foot {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-top: 1px solid var(--rule);
}

/* Buttons: scharfkantig und in Vollfarbe, so wie auf ihk-muenchen.de. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 18px; border: 1px solid transparent; border-radius: 0;
  font: inherit; font-size: 13px; font-weight: 600; line-height: 1;
  cursor: pointer; white-space: nowrap;
  transition: background-color .12s, border-color .12s, color .12s;
}
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--ihk-blue-dark); color: #fff; }
.btn-primary:hover { background: #002247; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-ink); }
.btn-outline { background: var(--surface); color: var(--ink); border-color: var(--titan-30); }
.btn-outline:hover { background: var(--accent-wash); border-color: var(--accent); }
.btn-quiet { background: none; color: var(--fg-muted); }
.btn-quiet:hover { background: #F5F7F9; color: var(--ink); }
.btn-danger { background: var(--surface); color: var(--ihk-red); border-color: #EFC3BB; }
.btn-danger:hover { background: #FDF1EF; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-sm { height: 28px; padding: 0 11px; font-size: 12px; }

/* Statusmarker: eckig mit farbigem Balken links. Runde Pillen waeren der
   bequeme Standard - die IHK ist kantig, also sind wir es auch. */
.mark {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px 2px 6px; border-left: 3px solid var(--titan-30);
  background: #F5F7F9; color: var(--fg-muted);
  font-size: 11.5px; font-weight: 600; line-height: 1.45;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.mark.is-ok    { border-color: var(--green);      background: #EDF7F2; color: #176A49; }
.mark.is-warn  { border-color: var(--ihk-yellow); background: #FFF9E3; color: #7A5D00; }
.mark.is-alert { border-color: var(--ihk-red);    background: #FCF0ED; color: #A32E1B; }
.mark.is-info  { border-color: var(--accent);     background: var(--accent-wash); color: #005C7C; }
.mark.is-ink   { border-color: var(--ihk-blue-dark); background: #EDF1F6; color: var(--ink); }

.ic { width: 18px; height: 18px; flex: 0 0 18px; }
.mark svg { width: 13px; height: 13px; flex: 0 0 13px; }

.dot { width: 7px; height: 7px; flex: 0 0 7px; display: inline-block; }
.dot.is-ok { background: var(--green); }
.dot.is-warn { background: var(--ihk-yellow); }
.dot.is-alert { background: var(--ihk-red); }
.dot.is-info { background: var(--accent); }
.dot.is-idle { background: var(--titan-30); }

/* Kennzahlen. Beschriftung in normaler Schreibweise - Versalien waeren
   der uebliche Reflex und lesen sich schlechter. */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
.kpi {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--shadow-card); padding: 14px 16px;
  border-top: 3px solid transparent;
}
.kpi.is-alert { border-top-color: var(--ihk-red); }
.kpi.is-warn  { border-top-color: var(--ihk-yellow); }
.kpi.is-ok    { border-top-color: var(--green); }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--fg-muted); }
.kpi-value {
  margin-top: 4px; font-size: 30px; font-weight: 300; line-height: 1.05;
  color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.kpi-value small { font-size: 15px; font-weight: 400; color: var(--fg-muted); }
.kpi-hint { margin-top: 3px; font-size: 11.5px; color: var(--fg-faint); }

/* Tabellen */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; padding: 8px 10px; font-size: 11.5px; font-weight: 600;
  color: var(--fg-muted); border-bottom: 1px solid var(--titan-30); white-space: nowrap;
}
.table td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: #FAFBFC; }
.table .r { text-align: right; font-variant-numeric: tabular-nums; }
.table .strong { color: var(--ink); font-weight: 600; }
.table-wrap { overflow-x: auto; }

.field {
  height: 32px; padding: 0 10px; border: 1px solid var(--titan-30);
  border-radius: 0; background: var(--surface); font: inherit; font-size: 13px;
  color: var(--fg);
}
.field:focus { border-color: var(--accent); outline: 2px solid rgba(0,158,212,.2); outline-offset: -1px; }
select.field { height: 32px; }

/* Filterreiter */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 28px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--titan-30); background: var(--surface); border-radius: 0;
  font: inherit; font-size: 12px; font-weight: 600; color: var(--fg-muted); cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ihk-blue-dark); border-color: var(--ihk-blue-dark); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }

/* Hinweisleisten */
.banner {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-left: 4px solid var(--titan-30);
  background: var(--surface); border-radius: 0 var(--r-card) var(--r-card) 0;
  box-shadow: var(--shadow-card); font-size: 13px;
}
.banner.is-alert { border-color: var(--ihk-red); }
.banner.is-warn  { border-color: var(--ihk-yellow); }
.banner.is-ok    { border-color: var(--green); }
.banner.is-info  { border-color: var(--accent); }
.banner svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; }
.banner b { color: var(--ink); }
.banner .grow { flex: 1; min-width: 0; }

.empty {
  padding: 32px 20px; text-align: center; color: var(--fg-muted); font-size: 13px;
}
.empty b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--fg-muted); }
.faint { color: var(--fg-faint); }
.small { font-size: 12px; }
.tiny { font-size: 11.5px; }
.cols-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }

/* ==========================================================================
   Kopfbereich des Cockpits — sagt, was die Woche jetzt braucht
   ========================================================================== */

.weekhero {
  display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  background: var(--ihk-blue-dark); color: #fff;
  border-radius: var(--r-card); padding: 22px 26px;
  box-shadow: var(--shadow-lift);
}
.weekhero h2 { color: #fff; font-size: 26px; font-weight: 300; letter-spacing: -.02em; line-height: 1.15; }
.weekhero h2 em { font-style: normal; font-weight: 600; }
.weekhero p { margin: 6px 0 0; font-size: 13.5px; color: rgba(255,255,255,.72); max-width: 62ch; }
.weekhero-actions { display: flex; gap: 8px; }
.weekhero .btn-outline { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.weekhero .btn-outline:hover { background: rgba(255,255,255,.12); border-color: #fff; }
.weekhero-clock { text-align: right; }
.weekhero-clock .t { font-size: 34px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.weekhero-clock .d { font-size: 12.5px; color: rgba(255,255,255,.7); margin-top: 4px; }

/* ==========================================================================
   Die Wochen-Kette
   ========================================================================== */

.chain { display: flex; align-items: stretch; gap: 2px; overflow-x: auto; padding-bottom: 2px; }
.chain-arrow { display: grid; place-items: center; color: var(--titan-30); flex: 0 0 18px; }
.chain-arrow svg { width: 16px; height: 16px; }

.stage {
  flex: 1 1 0; min-width: 150px;
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 14px 10px 13px; background: #F7F9FA; border: 0; border-top: 3px solid var(--titan-30);
  font: inherit; text-align: center; cursor: pointer;
  transition: background-color .12s, box-shadow .12s;
}
.stage:hover { background: var(--surface); box-shadow: var(--shadow-card); }
.stage.is-done  { border-top-color: var(--green); }
.stage.is-open  { border-top-color: var(--ihk-yellow); }
.stage.is-alert { border-top-color: var(--ihk-red); }
.stage.is-idle  { border-top-color: var(--titan-30); }
.stage-ring { position: relative; width: 66px; height: 66px; }
.stage-ring .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums;
}
.stage-ring .pct small { font-size: 10px; font-weight: 500; }
.stage-name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.stage-name svg { width: 14px; height: 14px; color: var(--fg-muted); }
.stage-note { font-size: 11.5px; color: var(--fg-muted); line-height: 1.35; }

/* ==========================================================================
   Speisekarte — das 21-Felder-Raster. Hier darf es aussehen wie ein
   Speiseplan zum Aushaengen: durchgehendes Raster, dunkelblaue Tagesleiste.
   ========================================================================== */

.plan-layout { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 16px; align-items: start; }

.plan {
  display: grid;
  grid-template-columns: 104px repeat(7, minmax(0,1fr));
  gap: 1px; background: var(--titan-30);
  border-radius: var(--r-card); overflow: hidden;
  box-shadow: var(--shadow-card);
}

.plan-corner { background: var(--ihk-blue-dark); }
.plan-day {
  background: var(--ihk-blue-dark); color: #fff;
  padding: 9px 10px 8px; text-align: left;
}
.plan-day b { display: block; font-size: 13px; font-weight: 600; }
.plan-day span { display: block; font-size: 11px; color: rgba(255,255,255,.66); font-variant-numeric: tabular-nums; }
.plan-day.is-weekend { background: #0B4478; }
.plan-day.is-today b::after { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--ihk-yellow); margin-left: 6px; vertical-align: 3px; }

.plan-meal {
  background: #EDF1F6; padding: 10px; display: flex; flex-direction: column; justify-content: center;
}
.plan-meal b { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.plan-meal span { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

.cell {
  position: relative; display: flex; min-height: 96px;
  background: var(--surface); border-left: 3px solid transparent;
  transition: background-color .1s;
}
.cell:hover { background: #F7FAFC; }
.cell.is-weekend { background: #FCFDFD; }
.cell.is-weekend:hover { background: #F5F9FB; }
.cell-main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  padding: 8px 9px; border: 0; background: none; color: inherit;
  font: inherit; text-align: left; cursor: pointer;
}
.cell-dish {
  font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.25;
  display: block; overflow-wrap: anywhere; hyphens: auto;
}
.cell-meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
.cell-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--fg-faint); font-size: 12px;
}
.cell-empty .plus { font-size: 19px; font-weight: 300; line-height: 1; color: var(--titan-30); }
.cell.is-target { border-left-color: var(--accent); background: var(--accent-wash); }
.cell.is-target .cell-empty { color: var(--accent-ink); }
.cell.is-conflict { border-left-color: var(--ihk-red); background: #FDF3F1; }
.cell-tools { position: absolute; top: 5px; right: 5px; display: none; gap: 3px; z-index: 2; }
.cell:hover .cell-tools { display: flex; }
.cell-tool {
  width: 21px; height: 21px; display: grid; place-items: center; padding: 0;
  border: 0; background: #fff; box-shadow: var(--shadow-card);
  color: var(--fg-muted); cursor: pointer; font-size: 13px; line-height: 1;
}
.cell-tool:hover { color: var(--accent-ink); }
.cell-tool.t-clear:hover { color: var(--ihk-red); }
.cell-tool svg { width: 12px; height: 12px; }

.plan-foot-label {
  background: #EDF1F6; padding: 9px 10px;
  display: flex; flex-direction: column; justify-content: center; line-height: 1.35;
}
.plan-foot-label b { font-size: 11.5px; font-weight: 600; color: var(--ink); }
.plan-guests { background: var(--surface); padding: 8px 9px; }
.plan-guests .g { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.plan-guests .bar { margin-top: 5px; height: 4px; background: #EDF1F6; }
.plan-guests .bar i { display: block; height: 100%; background: var(--accent); }

/* Speisen-Auswahl neben dem Raster */
.picker { position: sticky; top: calc(var(--head-h) + 20px); }
.picker-list { max-height: 60vh; overflow-y: auto; margin: 0 -18px -16px; }
.pick {
  width: 100%; display: block; text-align: left; border: 0; background: none;
  padding: 8px 18px; border-bottom: 1px solid var(--rule); font: inherit; cursor: pointer;
}
.pick:hover { background: var(--accent-wash); }
.pick b { display: block; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.pick .pick-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.pick.is-used { cursor: not-allowed; background: #FAFBFC; }
.pick.is-used b { color: var(--fg-faint); text-decoration: line-through; font-weight: 400; }
.pick.is-used:hover { background: #FAFBFC; }
.pick-used-note { font-size: 11.5px; color: var(--ihk-red); font-weight: 600; }

.tag {
  display: inline-block; padding: 1px 5px; font-size: 10.5px; font-weight: 600;
  background: #F0F3F5; color: var(--fg-muted); border-left: 2px solid var(--titan-30);
}
.tag.veg { border-color: var(--green); color: #176A49; background: #EDF7F2; }
.tag.alg { border-color: var(--ihk-yellow); color: #7A5D00; background: #FFF9E3; }
.tag.time { border-color: var(--accent); color: #005C7C; background: var(--accent-wash); }
.tag.warn { border-color: var(--ihk-red); color: #A32E1B; background: #FCF0ED; }
.tag.season { border-color: var(--ihk-teal); color: #045F84; background: #E7F3F9; }

/* ==========================================================================
   Laufplan — die Maschine schlaegt vor, der Mensch bestaetigt
   ========================================================================== */

.drop {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; background: var(--surface);
  border: 2px dashed var(--titan-30); border-radius: var(--r-card);
}
.drop.is-over { border-color: var(--accent); background: var(--accent-wash); }
.drop-icon { width: 40px; height: 40px; display: grid; place-items: center; background: #EDF1F6; color: var(--ink); flex: 0 0 40px; }
.drop-icon svg { width: 20px; height: 20px; }

.find {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--rule); align-items: start;
}
.find:last-child { border-bottom: 0; }
.find-icon { width: 30px; height: 30px; display: grid; place-items: center; background: #EDF1F6; color: var(--ink); }
.find-icon svg { width: 16px; height: 16px; }
.find.t-zeit  .find-icon { background: var(--accent-wash); color: #005C7C; }
.find.t-alg   .find-icon { background: #FCF0ED; color: #A32E1B; }
.find.t-azubi .find-icon { background: #EDF7F2; color: #176A49; }
.find.t-spez  .find-icon { background: #FFF9E3; color: #7A5D00; }
.find-what { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; }
.find-src {
  margin-top: 4px; font-size: 12px; color: var(--fg-muted);
  padding-left: 9px; border-left: 2px solid var(--titan-30);
}
.find-src i { font-style: italic; }
.find-actions { display: flex; align-items: center; gap: 6px; }
.find.is-sel { box-shadow: inset 3px 0 0 var(--accent); }
.find.is-taken  { background: #F6FBF8; }
.find.is-dropped { opacity: .5; }
.find.is-dropped .find-what { text-decoration: line-through; font-weight: 400; }

.conf { display: inline-flex; align-items: center; gap: 3px; }
.conf i { width: 6px; height: 6px; background: var(--titan-30); display: block; }
.conf i.on { background: var(--ihk-blue-dark); }

/* ==========================================================================
   Dienstplan
   ========================================================================== */

.duty {
  display: grid; grid-template-columns: 196px repeat(7, minmax(0,1fr));
  gap: 1px; background: var(--titan-30);
  border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-card);
}
.duty-corner { background: var(--ihk-blue-dark); }
.duty-day { background: var(--ihk-blue-dark); color: #fff; padding: 8px 10px; }
.duty-day b { display: block; font-size: 12.5px; }
.duty-day span { font-size: 10.5px; color: rgba(255,255,255,.66); }
.duty-person { background: var(--surface); padding: 8px 10px; }
.duty-person b { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.25; }
.duty-person span { font-size: 11px; color: var(--fg-muted); }
.duty-person.is-azubi { box-shadow: inset 3px 0 0 var(--ihk-teal); }
.duty-cell {
  background: var(--surface); min-height: 42px; padding: 5px 6px;
  display: flex; flex-direction: column; gap: 3px; justify-content: center;
}
.shift {
  font-size: 11px; font-weight: 600; padding: 3px 6px; line-height: 1.2;
  border-left: 3px solid var(--accent); background: var(--accent-wash); color: #005C7C;
}
.shift.s-spaet { border-color: var(--ihk-blue-dark); background: #EDF1F6; color: var(--ink); }
.shift.s-frei { border-color: var(--titan-30); background: #F5F7F9; color: var(--fg-faint); font-weight: 500; }
.duty-cell.is-blocked {
  background: repeating-linear-gradient(135deg, #F7F9FA 0 6px, #EDF1F6 6px 12px);
}
.absence { font-size: 11px; font-weight: 600; padding: 3px 6px; line-height: 1.2; border-left: 3px solid var(--titan-30); background: rgba(255,255,255,.75); color: var(--fg-muted); }
.absence.a-urlaub { border-color: var(--ihk-teal); color: #045F84; }
.absence.a-schule { border-color: var(--green); color: #176A49; }
.absence.a-krank  { border-color: var(--ihk-red); color: #A32E1B; }

.cover-label { background: #EDF1F6; padding: 8px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink); }
.cover-cell { background: var(--surface); padding: 7px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.cover-cell.is-short { background: #FCF0ED; color: #A32E1B; font-weight: 600; }
.cover-cell b { color: var(--ink); }

/* ==========================================================================
   Lagerbestand — auf Tempo gebaut
   ========================================================================== */

.stock-in {
  width: 78px; height: 30px; padding: 0 8px; text-align: right;
  border: 1px solid var(--titan-30); background: var(--surface);
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stock-in:focus { border-color: var(--accent); outline: 2px solid rgba(0,158,212,.2); outline-offset: -1px; }
.stock-in.is-filled { background: #F6FBF8; border-color: #B8DFCB; }
.stock-in.is-bad { background: #FDF3F1; border-color: #EFC3BB; color: var(--ihk-red); }
.stock-stamp { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stock-group { border-left: 1px solid var(--rule); }

.bar-mini { height: 5px; background: #EDF1F6; width: 74px; }
.bar-mini i { display: block; height: 100%; background: var(--accent); }
.bar-mini i.low { background: var(--ihk-yellow); }
.bar-mini i.out { background: var(--ihk-red); }

/* ==========================================================================
   Schmale Bildschirme
   ========================================================================== */

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .plan-layout { grid-template-columns: 1fr; }
  .picker { position: static; }
  .cols-2 { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .content { padding: 16px 14px 48px; }
  .head { padding: 0 14px; gap: 12px; }
  .head-title p { display: none; }
  .weekpick-label { min-width: 128px; font-size: 12px; }
  .weekhero { grid-template-columns: 1fr; }
  .weekhero-clock { text-align: left; }
}

/* Breite Raster brechen nicht um, sie scrollen in ihrem eigenen Kasten -
   sonst verliert ein Speiseplan seine Form. Die Seite selbst scrollt nie
   nach rechts. */
.scrollbox { overflow-x: auto; padding-bottom: 2px; }
@media (max-width: 1024px) {
  .plan { min-width: 880px; }
  .duty { min-width: 940px; }
}

const state = {
  screen: 'cockpit',
  wi: 1,                    /* Startwoche: KW 37 */
  plan: {},                 /* plan[kw] = { F:[7], M:[7], A:[7] } mit Speisen-IDs */
  fund: {},                 /* fund[id] = 'neu' | 'ok' | 'weg' */
  ziel: null,               /* welches Feld die Speisen-Auswahl füllt */
  pick: { q:'', kat:'alle', saison:false },
  lager: {},                /* lager[artikel] = { m:{v,ts}, a:{v,ts} } */
  speisen: { q:'', kat:'alle', mz:'alle' },
};

const SAISON_JETZT = 'herbst';
const SAISON_NAME = { ganzjaehrig:'ganzjährig', fruehling:'Frühling', sommer:'Sommer', herbst:'Herbst', winter:'Winter' };
const KAT_NAME = {
  fleisch:'Fleisch', fisch:'Fisch', vegetarisch:'Vegetarisch', vegan:'Vegan',
  suppe:'Suppe', salat:'Salat', beilage:'Beilage', dessert:'Dessert',
  backwaren:'Backwaren', aufschnitt:'Aufschnitt', suess:'Süßspeise',
};
const ALLERGEN = {
  A:'Gluten', B:'Krebstiere', C:'Ei', D:'Fisch', E:'Erdnuss', F:'Soja', G:'Milch',
  H:'Nüsse', I:'Sellerie', J:'Senf', K:'Sesam', L:'Sulfite', M:'Lupinen', N:'Weichtiere',
};

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const woche = () => WOCHEN[state.wi];
const planNow = () => state.plan[woche().kw];
const speise = (id) => SPEISEN.find(s => s.id === id);
const nf = (n, d) => Number(n).toLocaleString('de-DE', { minimumFractionDigits:d||0, maximumFractionDigits:d===undefined?0:d });

/* Kleiner, immer gleicher Zufall: derselbe Wochenplan bei jedem Öffnen. */
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff); }

/* Welche Speisen fuer eine Mahlzeit ueberhaupt in Frage kommen: mittags und
   abends eine Hauptkomponente, morgens die Fruehstuecks-Sachen. */
function topf(mz) {
  const wantHaupt = mz !== 'F';
  const eng = SPEISEN.filter(s => s.mz.includes(mz) && s.haupt === wantHaupt);
  return eng.length >= 8 ? eng : SPEISEN.filter(s => s.mz.includes(mz));
}

/* Eine Speise fuer ein Feld waehlen. Schon verplante sind ausgeschlossen —
   dadurch kann ein Vorschlag nie eine Doppelung enthalten. Speisen in der
   Saison werden bevorzugt, `ausser` schliesst die bisherige Speise aus,
   damit ein Tausch wirklich etwas aendert. */
function waehleSpeise(mz, plan, r, ausser) {
  const map = belegung(plan);
  const offen = topf(mz).filter(s => !map.has(s.id));
  let frei = ausser ? offen.filter(s => s.id !== ausser) : offen;
  if (!frei.length) frei = offen;
  const passend = frei.filter(s => s.saison === 'ganzjaehrig' || s.saison === SAISON_JETZT);
  if (passend.length) frei = passend;
  return frei.length ? frei[Math.floor(r() * frei.length)].id : null;
}

/* Die Woche wird immer komplett vorgeschlagen — alle 21 Felder. Aendern
   kannst du danach jedes einzelne. */
function buildPlan(w, saat) {
  const plan = { F:Array(7).fill(null), M:Array(7).fill(null), A:Array(7).fill(null) };
  const r = rnd((saat == null ? w.kw * 7919 : saat) >>> 0);
  for (const mz of ['M','A','F']) {
    for (let d = 0; d < 7; d++) plan[mz][d] = waehleSpeise(mz, plan, r);
  }
  return plan;
}

/* Nur die leeren Felder nachfuellen — fuer den Fall, dass du Felder geleert
   hast und sie wieder automatisch besetzen willst. */
function fuelleLuecken(plan) {
  const r = rnd(Date.now() >>> 0);
  let n = 0;
  for (const mz of ['M','A','F']) {
    for (let d = 0; d < 7; d++) {
      if (plan[mz][d]) continue;
      const id = waehleSpeise(mz, plan, r);
      if (id) { plan[mz][d] = id; n++; }
    }
  }
  return n;
}

/* Welche Speise ist wo verplant. Grundlage der Doppelungs-Sperre. */
function belegung(plan) {
  const map = new Map();
  for (const mz of ['F','M','A']) {
    for (let d = 0; d < 7; d++) {
      const id = plan[mz][d];
      if (!id) continue;
      if (!map.has(id)) map.set(id, []);
      map.get(id).push({ mz, d });
    }
  }
  return map;
}
const slotName = (s) => TAGE[s.d] + ' ' + MAHLZEIT.find(m => m.k === s.mz).name;

function doppelungen(plan) {
  const out = [];
  belegung(plan).forEach((slots, id) => { if (slots.length > 1) out.push({ id, slots }); });
  return out;
}
const belegt = (plan) => ['F','M','A'].reduce((n,mz) => n + plan[mz].filter(Boolean).length, 0);

/* Bestätigte Funde. Nur die wirken auf Speisekarte und Dienstplan. */
const fundStatus = (f) => state.fund[f.id] || 'neu';
const funde = (typ) => FUNDE.filter(f => !typ || f.typ === typ);
const fundeOk = () => FUNDE.filter(f => fundStatus(f) === 'ok');
const fundeNeu = () => FUNDE.filter(f => fundStatus(f) === 'neu');

/* Geänderte Buffetzeit für ein Feld — nur wenn der Fund bestätigt wurde. */
function zeitFuer(mz, d) {
  const f = fundeOk().find(f => f.typ === 'zeit' && f.tag === d);
  if (!f) return null;
  if (mz === 'M' && /Mittag/i.test(f.was)) return '11:30';
  if (mz === 'A' && /Abendessen/i.test(f.was)) return 'bis 18:30';
  return null;
}
function allergikerFuer(d) {
  const f = fundeOk().find(f => f.typ === 'alg' && f.tag === d);
  if (!f) return null;
  const m = f.was.match(/(\d+)/);
  return m ? Number(m[1]) : null;
}
function spezialFuer(d) { return fundeOk().filter(f => f.typ === 'spez' && f.tag === d); }

/* Abwesenheiten: aus den Mitarbeiterdaten plus bestätigte Azubi-Funde. */
function abwesenheit(p, d) {
  if (p.abwesend && p.abwesend.tage.includes(d)) return p.abwesend.art;
  const f = fundeOk().find(f => f.typ === 'azubi' && f.was.startsWith(p.name) && f.tag === d);
  return f ? 'schule' : null;
}

/* Streufunktion. Ein einfacher LCG taugt hier nicht: sein erster Wert haengt
   zu stark am Startwert — dadurch bekaeme jede Person dieselbe Schicht. */
function streu(a, b) {
  let h = Math.imul(a, 0x9E3779B1) ^ Math.imul(b, 0x85EBCA77);
  h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D);
  h = Math.imul(h ^ (h >>> 13), 0x297A2D39);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* Dienst je Person und Tag — gleichbleibend, damit der Plan nicht springt.
   Am Wochenende hat mehr Personal frei. Jede zweite Reihe neigt zum
   Spaetdienst, damit eine gemischte Mannschaft entsteht. */
function dienst(pi, d) {
  if (streu(pi + 1, d + 1) < (d >= 5 ? 0.36 : 0.12)) return 'frei';
  const neigung = pi % 2 === 0 ? 0.74 : 0.26;
  return streu(pi + 101, d + 7) < neigung ? 'frueh' : 'spaet';
}

const R = {};

function go(id) {
  if (!NAV.some(n => n.id === id)) return;
  state.screen = id;
  state.ziel = null;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('is-active'));
  el('scr-' + id).classList.add('is-active');

function ring(pct, tone) {
  const size = 66, sw = 6, r = (size - sw) / 2, c = 2 * Math.PI * r;
  const col = { done:'var(--green)', open:'var(--ihk-yellow)', alert:'var(--ihk-red)', idle:'var(--titan-30)' }[tone];
  return '<div class="stage-ring"><svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
    '<circle cx="33" cy="33" r="' + r + '" fill="none" stroke="#EDF1F6" stroke-width="' + sw + '"/>' +
    '<circle cx="33" cy="33" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" ' +
    'stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - pct / 100)) + '"/></svg>' +
    '<span class="pct">' + pct + '<small>%</small></span></div>';
}

function dienstLuecken() {
  if (!woche().laufplan) return 0;
  let n = 0;
  for (let d = 0; d < 7; d++) for (const mz of ['F','M','A']) {
    if (besetzung(mz, d).ist < BEDARF[mz][d]) n++;
  }
  return n;
}

function besetzung(mz, d) {
  const soll = BEDARF[mz][d];
  let ist = 0;
  MITARBEITER.forEach((p, i) => {
    if (abwesenheit(p, d)) return;
    const s = dienst(i, d);
    if (s === 'frei') return;
    if (mz === 'F') { if (s === 'frueh') ist++; }
    else if (mz === 'M') ist++;                    /* mittags sind beide Schichten da */
    else if (s === 'spaet') ist++;
  });
  return { soll, ist };
}

function lagerOffen() {
  return ARTIKEL.length * 2 - Object.values(state.lager)
    .reduce((n,x) => n + (x.m && x.m.v !== '' ? 1 : 0) + (x.a && x.a.v !== '' ? 1 : 0), 0);
}

function stufen() {
  const w = woche(), p = planNow();
  const entschieden = FUNDE.filter(f => fundStatus(f) !== 'neu').length;
  const dop = doppelungen(p).length, bel = belegt(p), lueck = dienstLuecken();
  const raus = BESTELLUNGEN.filter(b => b.status === 'raus').length;
  const lagerVoll = ARTIKEL.length * 2 - lagerOffen();
  const leer = !w.laufplan;
  return [
    { id:'laufplan', name:'Laufplan', icon:'laufplan',
      pct: leer ? 0 : Math.round(entschieden / FUNDE.length * 100),
      tone: leer ? 'idle' : (fundeNeu().length ? 'open' : 'done'),
      note: leer ? 'kein PDF geladen'
                 : (fundeNeu().length ? fundeNeu().length + ' Funde offen' : FUNDE.length + ' Funde geklärt') },
    { id:'speisekarte', name:'Speisekarte', icon:'speise',
      pct: Math.round(bel / 21 * 100),
      tone: dop ? 'alert' : (bel === 21 ? 'done' : (bel ? 'open' : 'idle')),
      note: dop ? 'Speise doppelt' : bel + ' von 21 Feldern' },
    { id:'dienstplan', name:'Dienstplan', icon:'dienst',
      pct: leer ? 0 : Math.round((21 - lueck) / 21 * 100),
      tone: leer ? 'idle' : (lueck > 3 ? 'alert' : (lueck ? 'open' : 'done')),
      note: leer ? 'wartet auf Speisekarte' : (lueck ? lueck + ' Schichten unterbesetzt' : 'voll besetzt') },
    { id:'bestellung', name:'Bestellung', icon:'bestell',
      pct: leer ? 0 : Math.round(raus / 2 * 100),
      tone: leer ? 'idle' : (raus === 2 ? 'done' : 'open'),
      note: leer ? 'wartet' : raus + ' von 2 raus' },
    { id:'lager', name:'Lagerbestand', icon:'lager',
      pct: Math.round(lagerVoll / (ARTIKEL.length * 2) * 100),
      tone: lagerVoll === ARTIKEL.length * 2 ? 'done' : (lagerVoll ? 'open' : 'idle'),
      note: lagerOffen() + ' Zählungen fehlen' },
  ];
}

/* Was die Woche jetzt braucht — in der Reihenfolge der Kette, Fehler zuerst. */
function offenePunkte() {
  const w = woche(), p = planNow(), out = [];
  if (!w.laufplan) out.push({ txt:'Für KW ' + w.kw + ' liegt noch kein Laufplan vor', go:'laufplan', ton:'idle' });
  const dop = doppelungen(p);
  if (dop.length) {
    const s = speise(dop[0].id);
    out.push({ txt: (s ? s.name : 'Eine Speise') + ' steht zweimal in dieser Woche',
                kurz:'Eine Speise steht zweimal in dieser Woche', go:'speisekarte', ton:'alert' });
  }
  const leer = 21 - belegt(p);
  if (leer && w.laufplan) out.push({ txt: leer + (leer === 1 ? ' Feld' : ' Felder') + ' in der Speisekarte sind noch leer', go:'speisekarte', ton:'open' });
  if (fundeNeu().length) out.push({ txt: fundeNeu().length + ' Besonderheiten aus dem Laufplan sind noch nicht bestätigt', go:'laufplan', ton:'open' });
  const lueck = dienstLuecken();
  if (lueck && w.laufplan) out.push({ txt: lueck + ' Schichten im Dienstplan sind unterbesetzt', go:'dienstplan', ton:'open' });
  const off = BESTELLUNGEN.filter(b => b.status === 'offen');
  if (off.length && w.laufplan) out.push({ txt: off[0].name + ' ist noch nicht raus', go:'bestellung', ton:'open' });
  if (lagerOffen()) out.push({ txt: lagerOffen() + ' Lager-Zählungen fehlen', go:'lager', ton:'open' });
  return out;
}

  const essen = w.gaeste.reduce((n,g) => n + g.F + g.M + g.A, 0);
  const alg = fundeOk().filter(f => f.typ === 'alg');

  const heute = w.heute != null ? w.heute : 0;

  el('scr-cockpit').innerHTML =
    '<div class="stack">' +

          (punkte.length ? '<button class="btn btn-accent" data-go="' + punkte[0].go + '">' + esc(NAV.find(n => n.id === punkte[0].go).label) + ' öffnen</button>' : '') +
          '<button class="btn btn-outline" data-go="speisekarte">Speisekarte ansehen</button>' +
        '</div>' +
      '</div>' +
      '<div class="weekhero-clock"><div class="t" id="uhr">--:--</div><div class="d" id="datum"></div></div>' +
    '</section>' +

    '<div class="kpis">' +
      kpi('Essen diese Woche', nf(essen), 'Frühstück, Mittag und Abendessen zusammen') +
      kpi('Allergiker', algSum || '–', algMax.n ? 'Spitze ' + TAGE[algMax.t] + ': ' + algMax.n + ' Personen' : 'noch keine Funde bestätigt', algSum > 20 ? 'is-warn' : '') +
      kpi('Personal heute', (MITARBEITER.length - abw.length) + '<small> von ' + MITARBEITER.length + '</small>',
          abw.length ? abw.map(x => ABW_NAME[abwesenheit(x, heute)]).join(', ') : 'alle da', abw.length > 2 ? 'is-warn' : 'is-ok') +
      kpi('Bestellungen', bRaus + '<small> von 2</small>', bRaus < 2 ? BESTELLUNGEN.find(b => b.status === 'offen').name + ' offen' : 'beide versandt', bRaus < 2 ? 'is-warn' : 'is-ok') +
      kpi('Unter Mindestbestand', knapp.length || '0', knapp.length ? knapp.slice(0,3).map(a => a.name).join(', ') : 'alles ausreichend', knapp.length ? 'is-alert' : 'is-ok') +
    '</div>' +

    '<section class="card">' +
      '<div class="card-head"><h2>Die Woche in fünf Schritten</h2>' +
        '<span class="sub">Jeder Schritt füttert den nächsten. Klick auf einen Schritt springt dorthin.</span></div>' +
      '<div class="card-body"><div class="chain">' +

          '<button class="stage is-' + s.tone + '" data-go="' + s.id + '">' +

      '<section class="card">' +
        '<div class="card-head"><h2>Was jetzt zu tun ist</h2></div>' +
        '<div class="card-body" style="padding-top:10px">' +
          (punkte.length
            ? '<div class="stack" style="gap:8px">' + punkte.map(x =>

function kpi(label, value, hint, tone) {
  return '<div class="kpi ' + (tone||'') + '">' +

    '<div class="kpi-value">' + value + '</div>' +
    '<div class="kpi-hint">' + esc(hint) + '</div></div>';
}

function besonderheitenListe() {
  const w = woche();
  if (!w.laufplan) return '<div class="empty"><b>Kein Laufplan geladen</b>Ohne PDF wissen wir nicht, was in dieser Woche los ist.</div>';

    '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--rule)">' +

        esc(FUND_TYP[f.typ].name) + '</span>' +
      '<span class="grow small" style="color:var(--ink);font-weight:600">' + esc(f.was) + '</span>' +

                               : '<span class="tiny faint">' + (f.tag != null ? TAGE[f.tag] : 'ganze Woche') + '</span>') +
    '</div>').join('') + '</div>';
}

function uhrStellen() {
  const u = el('uhr'); if (!u) return;

  u.textContent = jetzt.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });

}
setInterval(() => { if (state.screen === 'cockpit') uhrStellen(); }, 20000);

state.fundFilter = 'alle';
state.fundSel = 1;

R.laufplan = function () {
  const w = woche();
  if (!w.laufplan) {
    el('scr-laufplan').innerHTML =
      '<div class="stack">' + dropZone(null) +
      '<div class="card"><div class="empty"><b>Noch kein Laufplan für KW ' + w.kw + '</b>' +
      'Sobald das PDF da ist, liest es das Dashboard aus und legt dir die Besonderheiten hier zur Bestätigung vor.</div></div></div>';
    return;
  }

  const f = state.fundFilter;
  const sicht = FUNDE.filter(x => f === 'alle' || x.typ === f);
  const neu = fundeNeu();
  const sicher = neu.filter(x => x.conf >= 4);

  el('scr-laufplan').innerHTML =
    '<div class="stack">' +

    dropZone(w.laufplan) +

    (neu.length
      ? '<div class="banner is-warn">' + ico('warn') +
        '<div class="grow"><b>' + neu.length + ' Funde warten auf deine Bestätigung.</b> ' +

        (sicher.length ? '<button class="btn btn-outline btn-sm" id="bulk-ok">Die ' + sicher.length + ' sicheren übernehmen</button>' : '') +
        '</div>'
      : '<div class="banner is-ok">' + ico('check') +
        '<div class="grow"><b>Alle ' + FUNDE.length + ' Funde sind geklärt.</b> ' +
        'Die bestätigten Besonderheiten stehen jetzt in Speisekarte und Dienstplan.</div></div>') +

    '<div class="banner is-info">' + ico('info') +
      '<div class="grow"><b>Neu gegenüber KW ' + (w.kw - 1) + ':</b> ' +
      'Mittagsbuffet Mittwoch vorgezogen, vegane Gruppe am Dienstag, Empfang am Mittwochabend, ' +

    '<div class="cols-2">' +
      '<section class="card">' +
        '<div class="card-head" style="padding-bottom:12px">' +
          '<h2>Erkannte Besonderheiten</h2><span class="sub">' + FUNDE.length + ' Funde auf ' + w.laufplan.seiten + ' Seiten</span>' +
        '</div>' +

    state.fund[Number(b.dataset.fund)] = b.dataset.act;

  if (bulk) bulk.onclick = () => { sicher.forEach(x => state.fund[x.id] = 'ok'); neuZeichnen(); };

function dropZone(lp) {

    '<span class="drop-icon">' + ico(lp ? 'datei' : 'hoch') + '</span>' +
    '<div class="grow">' +

/* Die Vorschau folgt dem angeklickten Fund: richtige Seite, richtige
   Fundstelle hervorgehoben. Die Zeilen drumherum sind nachgestellt. */
function vorschau() {
  const f = FUNDE.find(x => x.id === state.fundSel) || FUNDE[0];
  const tagName = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const w = woche();
  const kopf = f.tag != null
    ? 'Laufplan KW ' + w.kw + ' — ' + tagName[f.tag] + ', ' + w.datum[f.tag] + '2026'
    : 'Laufplan KW ' + w.kw + ' — Übersicht Teilnehmende';
  const drumherum = {
    zeit:  [['08:00–11:30','Unterricht, Raum 2.14'], ['12:30–15:45','Fortsetzung praktischer Teil']],
    alg:   [['Spalte Mo','Kurs 4790, Kurs 4811'], ['Spalte Di','Kurs 4802']],
    azubi: [['Zuständig','Ausbildungsleitung Fr. Hofstetter'], ['Rückkehr','wie im Blockplan vermerkt']],
    spez:  [['Ansprechpartner','Seminarorganisation, Durchwahl 214'], ['Rückmeldung','bis Freitag der Vorwoche']],
  }[f.typ];
  const zeile = (a, b) => '<div style="display:flex;gap:10px"><span style="flex:0 0 92px;' +
    'font-variant-numeric:tabular-nums">' + esc(a) + '</span><span>' + esc(b) + '</span></div>';
  return '<section class="card picker">' +
    '<div class="card-head"><h2>Seitenvorschau</h2><span class="sub">Seite ' + f.seite + '</span></div>' +
    '<div class="card-body">' +
      '<div style="background:#FBFCFD;border:1px solid var(--rule);padding:16px;font-size:11.5px;line-height:1.75;color:var(--fg-muted)">' +
        '<div style="color:var(--ink);font-weight:600;font-size:12.5px">' + esc(kopf) + '</div>' +
        '<div style="height:1px;background:var(--titan-30);margin:8px 0"></div>' +
        zeile(drumherum[0][0], drumherum[0][1]) +
        '<div style="background:#FFF9E3;color:#7A5D00;font-weight:600;padding:3px 6px;margin:3px -6px">' +
          esc(f.zitat) + '</div>' +
        zeile(drumherum[1][0], drumherum[1][1]) +
      '</div>' +
      '<div class="row" style="margin-top:10px;align-items:flex-start;gap:8px">' + ico('info', 'faint') +
        '<p class="tiny faint" style="margin:0">Die hervorgehobene Zeile ist die Fundstelle. ' +
        'Im Prototyp sind die Zeilen darum nachgestellt — später ist es die echte PDF-Seite. ' +
        'Klick auf einen Fund links wechselt die Seite.</p></div>' +
    '</div></section>';
}

function fundZeile(f) {
  const st = fundStatus(f);
  return '<div class="find t-' + f.typ + (st === 'ok' ? ' is-taken' : st === 'weg' ? ' is-dropped' : '') +
    (state.fundSel === f.id ? ' is-sel' : '') + '" data-find="' + f.id + '" style="cursor:pointer">' +
    '<span class="find-icon">' + ico(FUND_TYP[f.typ].icon) + '</span>' +
    '<div>' +
      '<div class="find-what">' + esc(f.was) +
        (f.neu ? ' <span class="mark is-info" style="margin-left:4px">neu</span>' : '') + '</div>' +
      '<div class="small muted" style="margin-top:2px">' + esc(f.detail) +
        ' · betrifft ' + (f.tag != null ? TAGE[f.tag] : 'die ganze Woche') + '</div>' +
      '<div class="find-src">Seite ' + f.seite + ' — <i>„' + esc(f.zitat) + '"</i></div>' +
    '</div>' +
    '<div class="find-actions">' +
      '<span class="conf" title="Wie sicher der Fund gelesen wurde">' +
        [1,2,3,4].map(i => '<i class="' + (i <= f.conf ? 'on' : '') + '"></i>').join('') + '</span>' +
      (st === 'neu'
        ? '<button class="btn btn-primary btn-sm" data-fund="' + f.id + '" data-act="ok">Übernehmen</button>' +
          '<button class="btn btn-danger btn-sm" data-fund="' + f.id + '" data-act="weg">Verwerfen</button>'
        : '<span class="mark ' + (st === 'ok' ? 'is-ok' : '') + '">' + (st === 'ok' ? 'übernommen' : 'verworfen') + '</span>' +
          '<button class="btn btn-quiet btn-sm" data-fund="' + f.id + '" data-act="neu">rückgängig</button>') +
    '</div></div>';
}

/* ==========================================================================
   7 · SPEISEKARTE — 21 Felder, mit eingebauter Doppelungs-Sperre
   ========================================================================== */

R.speisekarte = function () {
  const w = woche(), p = planNow();
  const bel = belegt(p), dop = doppelungen(p), map = belegung(p);

  let banner;
  if (dop.length) {
    const d = dop[0], s = speise(d.id);
    banner = '<div class="banner is-alert">' + ico('warn') +
      '<div class="grow"><b>' + esc(s ? s.name : 'Eine Speise') + ' steht zweimal in dieser Woche.</b> ' +
      'Gefunden bei ' + d.slots.map(slotName).map(esc).join(' und ') + '. ' +
      'Ein Gericht darf pro Woche nur einmal vorkommen — auch über Frühstück, Mittag und Abendessen hinweg. ' +
      'Vorgeschlagen wird so etwas nie; diese Leiste ist nur das Sicherheitsnetz.</div>' +
      '<button class="btn btn-danger btn-sm" data-fix="' + d.slots[1].mz + '-' + d.slots[1].d + '">' +
      esc(slotName(d.slots[1])) + ' leeren</button></div>';
  } else if (bel < 21) {
    banner = '<div class="banner is-warn">' + ico('info') +
      '<div class="grow"><b>' + (21 - bel) + (21 - bel === 1 ? ' Feld ist' : ' Felder sind') + ' leer.</b> ' +
      'Entweder wählst du rechts selbst eine Speise, oder du lässt die Lücken automatisch füllen.</div>' +
      '<button class="btn btn-primary btn-sm" id="luecken">Lücken füllen</button></div>';
  } else if (w.status === 'freigegeben') {
    banner = '<div class="banner is-ok">' + ico('check') +
      '<div class="grow"><b>Speisekarte KW ' + w.kw + ' ist freigegeben.</b> ' +
      'Die Bestellung rechnet jetzt damit. Änderungen sind weiter möglich.</div></div>';
  } else if (!w.laufplan) {
    banner = '<div class="banner is-info">' + ico('info') +
      '<div class="grow"><b>Vorschlag für KW ' + w.kw + ' steht — alle 21 Felder sind gefüllt.</b> ' +
      'Der Laufplan für diese Woche fehlt noch, deshalb kennt das Dashboard weder Gästezahlen ' +
      'noch Besonderheiten. Der Vorschlag beachtet bisher nur Mahlzeit, Jahreszeit und die ' +
      'Regel „kein Gericht zweimal".</div></div>';
  } else {
    banner = '<div class="banner is-ok">' + ico('check') +
      '<div class="grow"><b>Vorschlag steht — alle 21 Felder sind gefüllt, keine Speise doppelt.</b> ' +
      'Zum Ändern: Klick auf ein Feld wählt eine andere Speise, das Pfeilsymbol im Feld tauscht ' +
      'automatisch, das Kreuz leert es. Unten kannst du die ganze Woche neu vorschlagen lassen.</div></div>';
  }

  /* --- Raster ---------------------------------------------------------- */
  let g = '<div class="plan-corner"></div>';
  for (let d = 0; d < 7; d++) {
    g += '<div class="plan-day' + (d > 4 ? ' is-weekend' : '') + (w.heute === d ? ' is-today' : '') + '">' +
      '<b>' + TAGE[d] + '</b><span>' + w.datum[d] + '</span></div>';
  }
  for (const m of MAHLZEIT) {
    g += '<div class="plan-meal"><b>' + esc(m.name) + '</b><span>' + m.zeit + '</span></div>';
    for (let d = 0; d < 7; d++) g += zelle(m.k, d, p, map, w);
  }
  g += '<div class="plan-foot-label"><b>Essen am Tag</b>' +
       '<span class="tiny faint">Frühstück · Mittag · Abend</span></div>';
  const maxG = Math.max(1, ...w.gaeste.map(x => x.F + x.M + x.A));
  for (let d = 0; d < 7; d++) {
    const t = w.gaeste[d].F + w.gaeste[d].M + w.gaeste[d].A;
    const gg = w.gaeste[d];
    g += '<div class="plan-guests"><div class="g">' + (t || '–') + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(t / maxG * 100) + '%"></i></div>' +
      '<div class="tiny faint" style="margin-top:3px;font-variant-numeric:tabular-nums">' +
      (t ? gg.F + ' · ' + gg.M + ' · ' + gg.A : 'mit Laufplan') + '</div></div>';
  }

  const frei = SPEISEN.filter(s => !map.has(s.id)).length;

  el('scr-speisekarte').innerHTML =
    '<div class="stack">' + banner +
    '<div class="plan-layout">' +
      '<div class="stack">' +
        '<div class="scrollbox"><div class="plan">' + g + '</div></div>' +
        '<div class="card"><div class="card-foot" style="border-top:0;flex-wrap:wrap">' +
          '<button class="btn btn-primary" ' +
            (bel === 21 && !dop.length && w.status !== 'freigegeben' ? '' : 'disabled') + ' id="freigabe">' +
            (w.status === 'freigegeben' ? 'Bereits freigegeben' : 'Speisekarte KW ' + w.kw + ' freigeben') + '</button>' +
          '<button class="btn btn-outline" id="neu-vorschlag">' + ico('sync') + 'Woche neu vorschlagen</button>' +
          (bel < 21 ? '<button class="btn btn-outline" id="luecken2">' + (21 - bel) + ' Lücken füllen</button>' : '') +
          '<button class="btn btn-outline" onclick="window.print()">Als PDF drucken</button>' +
          '<span class="grow"></span>' +
          '<span class="tiny faint">' + frei + ' von ' + SPEISEN.length + ' Speisen sind diese Woche noch frei. ' +
          'Bei 21 Feldern reichen ' + SPEISEN.length + ' Speisen für ' +
          Math.floor(SPEISEN.length / 21) + ' Wochen ohne jede Wiederholung.</span>' +
        '</div></div>' +
      '</div>' +
      auswahl() +
    '</div></div>';

  document.querySelectorAll('[data-cell]').forEach(b => b.onclick = (e) => {
    if (e.target.closest('[data-clear]')) return;
    const [mz, d] = b.dataset.cell.split('-');
    state.ziel = { mz, d:Number(d) };
    R.speisekarte();
  });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const [mz, d] = b.dataset.clear.split('-');
    p[mz][Number(d)] = null; state.ziel = { mz, d:Number(d) }; neuZeichnen();
  });
  /* Ein Feld automatisch neu besetzen. Die bisherige Speise wird
     ausgeschlossen, damit der Tausch wirklich etwas aendert. */
  document.querySelectorAll('[data-swap]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const [mz, dd] = b.dataset.swap.split('-'); const d = Number(dd);
    const alt = p[mz][d];
    p[mz][d] = null;
    const neu = waehleSpeise(mz, p, rnd(Date.now() >>> 0), alt);
    p[mz][d] = neu || alt;
    neuZeichnen();
  });
  const nv = el('neu-vorschlag');
  if (nv) nv.onclick = () => {
    state.plan[w.kw] = buildPlan(w, Date.now());
    state.ziel = null; neuZeichnen();
  };
  ['luecken', 'luecken2'].forEach(id => {
    const b = el(id);
    if (b) b.onclick = () => { fuelleLuecken(p); state.ziel = null; neuZeichnen(); };
  });
  const fix = document.querySelector('[data-fix]');
  if (fix) fix.onclick = () => {
    const [mz, d] = fix.dataset.fix.split('-');
    p[mz][Number(d)] = null; state.ziel = { mz, d:Number(d) }; neuZeichnen();
  };
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    if (!state.ziel) return;
    const id = Number(b.dataset.pick);
    const schon = (belegung(p).get(id) || [])
      .filter(sl => !(sl.mz === state.ziel.mz && sl.d === state.ziel.d));
    if (schon.length) return;          /* Doppelung: gar nicht erst setzen */
    p[state.ziel.mz][state.ziel.d] = id;
    neuZeichnen();
  });
  const q = el('pick-q');
  if (q) {
    q.oninput = () => { state.pick.q = q.value; R.speisekarte(); el('pick-q').focus(); };
    if (state.pick.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  const kat = el('pick-kat');
  if (kat) kat.onchange = () => { state.pick.kat = kat.value; R.speisekarte(); };
  const sai = el('pick-saison');
  if (sai) sai.onclick = () => { state.pick.saison = !state.pick.saison; R.speisekarte(); };
  const fg = el('freigabe');
  if (fg) fg.onclick = () => {
    w.status = 'freigegeben'; neuZeichnen();
  };
};

function zelle(mz, d, p, map, w) {
  const id = p[mz][d], s = id ? speise(id) : null;
  const ziel = state.ziel && state.ziel.mz === mz && state.ziel.d === d;
  const konflikt = id && map.get(id) && map.get(id).length > 1;
  const zeit = zeitFuer(mz, d), algN = mz !== 'F' ? allergikerFuer(d) : null, spez = spezialFuer(d);

  let inhalt, werkzeuge = '';
  if (s) {
    let meta = '<span class="tag">' + esc(KAT_NAME[s.kat] || s.kat) + '</span>';
    if (s.kat === 'vegan' || s.kat === 'vegetarisch') meta += '<span class="tag veg">' + (s.kat === 'vegan' ? 'vegan' : 'veg.') + '</span>';
    if (s.saison !== 'ganzjaehrig' && s.saison !== SAISON_JETZT) meta += '<span class="tag season">nicht Saison</span>';
    if (s.allergene.length) meta += '<span class="tag alg">' + s.allergene.join(' ') + '</span>';
    if (zeit) meta += '<span class="tag time">' + esc(zeit) + '</span>';
    if (algN) meta += '<span class="tag warn">' + algN + ' Allergiker</span>';
    if (spez.length && mz !== 'F') meta += '<span class="tag warn">' + spez.length + '× Spezial</span>';
    inhalt = '<span class="cell-dish">' + esc(s.name) + '</span><span class="cell-meta">' + meta + '</span>';
    werkzeuge = '<span class="cell-tools">' +
      '<button class="cell-tool t-swap" data-swap="' + mz + '-' + d +
        '" title="Andere Speise vorschlagen" aria-label="Andere Speise vorschlagen">' + ico('sync') + '</button>' +
      '<button class="cell-tool t-clear" data-clear="' + mz + '-' + d +
        '" title="Feld leeren" aria-label="Feld leeren">×</button>' +
    '</span>';
  } else {
    inhalt = '<span class="cell-empty"><span class="plus">+</span>' +
      (ziel ? 'Speise rechts wählen' : 'leer') + '</span>';
  }
  return '<div class="cell' + (d > 4 ? ' is-weekend' : '') + (ziel ? ' is-target' : '') +
    (konflikt ? ' is-conflict' : '') + '">' +
    '<button class="cell-main" data-cell="' + mz + '-' + d + '">' + inhalt + '</button>' +
    werkzeuge + '</div>';
}

function auswahl() {
  const z = state.ziel;
  if (!z) {
    return '<section class="card picker"><div class="card-head"><h2>Speisen wählen</h2></div>' +
      '<div class="card-body"><div class="empty"><b>Kein Feld ausgewählt</b>' +
      'Klick links auf ein Feld im Raster. Dann erscheinen hier die Speisen, die für ' +
      'diese Mahlzeit passen.</div></div></section>';
  }
  /* Belegung ohne das Zielfeld: ein Gericht soll sich nicht selbst blockieren,
     wenn man das Feld neu besetzt. */
  const map = new Map();
  belegung(planNow()).forEach((slots, id) => {
    const rest = slots.filter(sl => !(sl.mz === z.mz && sl.d === z.d));
    if (rest.length) map.set(id, rest);
  });

  const mName = MAHLZEIT.find(m => m.k === z.mz).name;
  const q = state.pick.q.trim().toLowerCase();
  let liste = SPEISEN.filter(s => s.mz.includes(z.mz));
  if (state.pick.kat !== 'alle') liste = liste.filter(s => s.kat === state.pick.kat);
  if (state.pick.saison) liste = liste.filter(s => s.saison === 'ganzjaehrig' || s.saison === SAISON_JETZT);
  if (q) liste = liste.filter(s => s.name.toLowerCase().includes(q));
  liste = liste.slice().sort((a,b) => (map.has(a.id) - map.has(b.id)) || a.name.localeCompare(b.name, 'de'));

  const kats = [...new Set(SPEISEN.filter(s => s.mz.includes(z.mz)).map(s => s.kat))].sort();

  return '<section class="card picker">' +
    '<div class="card-head"><h2>' + esc(mName) + ' · ' + TAGE[z.d] + '</h2>' +
      '<span class="sub">' + liste.filter(s => !map.has(s.id)).length + ' wählbar</span></div>' +
    '<div class="card-body" style="padding-bottom:10px">' +
      '<input class="field" id="pick-q" style="width:100%" placeholder="Speise suchen" value="' + esc(state.pick.q) + '">' +
      '<div class="row" style="margin-top:8px">' +
        '<select class="field grow" id="pick-kat">' +
          '<option value="alle">Alle Kategorien</option>' +
          kats.map(k => '<option value="' + k + '"' + (state.pick.kat === k ? ' selected' : '') + '>' + esc(KAT_NAME[k] || k) + '</option>').join('') +
        '</select>' +
        '<button class="chip" id="pick-saison" aria-pressed="' + state.pick.saison + '">nur Saison</button>' +
      '</div>' +
      '<div class="picker-list">' +
        (liste.length ? liste.map(s => {
          const used = map.get(s.id);
          return '<button class="pick' + (used ? ' is-used' : '') + '"' + (used ? ' disabled' : ' data-pick="' + s.id + '"') + '>' +
            '<b>' + esc(s.name) + '</b><span class="pick-meta">' +
            (used ? '<span class="pick-used-note">schon am ' + esc(slotName(used[0])) + '</span>'
                  : '<span class="tag">' + esc(KAT_NAME[s.kat] || s.kat) + '</span>' +
                    (s.saison !== 'ganzjaehrig' ? '<span class="tag' + (s.saison === SAISON_JETZT ? ' season' : '') + '">' + esc(SAISON_NAME[s.saison]) + '</span>' : '') +
                    (s.allergene.length ? '<span class="tag alg">' + s.allergene.join(' ') + '</span>' : '') +
                    '<span class="tag">Aufwand ' + esc(s.aufwand) + '</span>') +
            '</span></button>';
        }).join('') : '<div class="empty">Keine Speise passt zu Suche und Filter.</div>') +
      '</div>' +
    '</div></section>';
}

/* ==========================================================================

const SCHICHT = { frueh:'Frühdienst', spaet:'Spätdienst', frei:'frei' };

  const w = woche();
  const lueck = dienstLuecken();

  }

  el('scr-dienstplan').innerHTML = '<div class="stack">' +
    (lueck
      ? '<div class="banner is-warn">' + ico('warn') + '<div class="grow"><b>' + lueck +
